global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend kong_frontend
    bind *:8000
    default_backend kong_nodes

backend kong_nodes
    balance roundrobin
    option httpchk GET /metrics
    http-check expect status 200
    default-server inter 3s fall 2 rise 2

    server kong1 kong1:8000 check port 8001
    server kong2 kong2:8000 check port 8001
    server kong3 kong3:8000 check port 8001
