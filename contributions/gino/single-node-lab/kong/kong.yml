# Public key and consumer ID from Gino's tested lab; align with your imported realm.
_format_version: '3.0'
services:
- name: demo-api
  url: http://demo-api:5000
  routes:
  - name: demo-route
    paths:
    - /api
    strip_path: true
consumers:
- username: doctor1
  jwt_secrets:
  - key: f0d61ed8-dd51-436a-b009-8064eab88f65
    algorithm: RS256
    secret: unused-for-rs256
    rsa_public_key: '-----BEGIN PUBLIC KEY-----

      

      -----END PUBLIC KEY-----
      '


- username: itadmin1
  jwt_secrets:
  - key: 768b3edb-1bb2-49fb-bef0-9aee15621cfb
    algorithm: RS256
    secret: unused-for-rs256
    rsa_public_key: '-----BEGIN PUBLIC KEY-----

      

      -----END PUBLIC KEY-----
      '

acls:
- consumer: doctor1
  group: doctor
- consumer: itadmin1
  group: it-admin
plugins:
- name: jwt
  route: demo-route
  config:
    key_claim_name: sub
    claims_to_verify:
    - exp
- name: acl
  route: demo-route
  config:
    allow:
    - doctor
- name: rate-limiting
  route: demo-route
  config:
    minute: 10
    policy: local
    limit_by: consumer
- name: prometheus
  config:
    status_code_metrics: true
    latency_metrics: true
    bandwidth_metrics: true
    per_consumer: true
