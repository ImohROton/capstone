name: capstone-handoff
services:
  kong:
    image: kong:3.9
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
    - ./kong:/kong/declarative:ro
    ports:
    - 127.0.0.1:8000:8000
    - 127.0.0.1:8001:8001
  demo-api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: healthcare
      PGUSER: capstone
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: healthcare
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    volumes:
    - keycloak-data:/opt/keycloak/data
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD
        in .env}
    command:
    - start-dev
    ports:
    - 127.0.0.1:8080:8080
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9090:9090
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - grafana-data:/var/lib/grafana
    - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD
        in .env}
volumes:
  keycloak-data: null
  postgres-data: null
  grafana-data: null
